<svg xmlns="http://www.w3.org/2000/svg" viewBox="284 97 479 348" role="img" aria-label="Running portfolio logo: two shoe soles side by side sharing one topographic climb, with a moss anchor in the right toe">
  <title>run.remikalir.com — logo</title>
  <desc>Two running-shoe soles set side by side with a gap between them, the right slightly higher than the left, each tilted toe-up at a slightly different angle. One topographic peak is split lengthwise into complementary halves across the two soles. A single moss dot anchors the toe of the right sole. Ink (#2E2A24) on transparent ground; moss (#5C7250) the one accent. Contour lines are the approved-composition placeholder pending tracing from the real Lake James (Fonta Flora) topography.</desc>
